name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      # No Google Cloud credentials in CI: agents, BigQuery and KMS use their deterministic fallbacks.
      CHRYSALIS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Core prototype tests
        run: pytest tests/ -q
      - name: Agent Platform edition tests
        working-directory: agent_platform_version
        run: pytest tests/ -q
